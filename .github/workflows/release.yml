# Builds SkyLink and publishes it under the repository's Releases tab.
#
# Two ways to release:
#   * push a version tag:      git tag v0.1.0  then  git push origin v0.1.0
#   * or run it by hand:       Actions > Release > Run workflow, enter a version (e.g. 0.1.0)
# A version with a suffix (0.2.0-beta.1) is published as a pre-release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (the tag v0.1.0 is created)'
        required: true

permissions:
  contents: write # create the release and upload the zip

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        id: ver
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = if ($env:EVENT -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME }
          $v = $v.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$v' is not a version like 1.2.3 or 1.2.3-beta.1" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Build the package
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $common = @('-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
                      '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true',
                      '-p:EnableCompressionInSingleFile=true', '-p:DebugType=None', '-p:DebugSymbols=false',
                      "-p:Version=$env:VERSION")
          dotnet publish src/SkyLink.App @common -o out/SkyLink
          if ($LASTEXITCODE -ne 0) { throw 'publishing the app failed' }
          dotnet publish src/SkyLink.Cli @common -o out/SkyLink/cli
          if ($LASTEXITCODE -ne 0) { throw 'publishing the command-line tool failed' }
          # The command-line tool uses the app's definitions folder one level up.
          Remove-Item out/SkyLink/cli/definitions -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item packaging/README.txt out/SkyLink/README.txt
          Compress-Archive -Path out/SkyLink/* -DestinationPath "out/SkyLink-$env:VERSION-win-x64.zip"

      - name: Check the package
        id: check
        shell: pwsh
        run: |
          & out/SkyLink/cli/skylink.exe lint
          if ($LASTEXITCODE -ne 0) { throw 'the packaged aircraft definitions do not pass lint' }
          if (-not (Test-Path out/SkyLink/SkyLink.exe)) { throw 'SkyLink.exe is missing from the package' }
          # SimConnect.dll ships when third_party/SimConnect holds the official SDK copy.
          if (Test-Path third_party/SimConnect/SimConnect.dll) {
            foreach ($p in 'out/SkyLink/SimConnect.dll', 'out/SkyLink/cli/SimConnect.dll') {
              if (-not (Test-Path $p)) { throw "$p is missing although third_party/SimConnect/SimConnect.dll exists" }
            }
            "simconnect=SimConnect.dll is included." >> $env:GITHUB_OUTPUT
          } else {
            "simconnect=Put **SimConnect.dll** next to ``SkyLink.exe``. It comes with the MSFS 2024 SDK (``SimConnect SDK\lib\SimConnect.dll``)." >> $env:GITHUB_OUTPUT
          }

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: SkyLink ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: out/SkyLink-${{ steps.ver.outputs.version }}-win-x64.zip
          body: |
            ## Download

            **SkyLink-${{ steps.ver.outputs.version }}-win-x64.zip**: unzip anywhere and run `SkyLink.exe`. No .NET install needed (Windows 10/11, 64-bit).

            Before the first flight:
            1. ${{ steps.check.outputs.simconnect }}
            2. When Windows Firewall asks, allow SkyLink on **both** private and public networks (UDP 47800–47802).

            The zip's `README.txt` has the full quick start.
